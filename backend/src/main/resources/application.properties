server.port=${SERVER_PORT:${PORT:8080}}
spring.application.name=cashtrack-backend

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cashtrack}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME:cashtrack_app}
spring.datasource.password=${DB_PASSWORD:changeme}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway - checks classpath first (packaged in JAR), then filesystem fallbacks
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,filesystem:${MIGRATIONS_PATH:../database/migrations},filesystem:/app/migrations
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# CORS - consumed in CorsConfig.java
cashtrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.cashtrack=${LOG_LEVEL_APP:DEBUG}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
